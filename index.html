<style>
  :root{
    --alabaster:#FAF8F5;
    --desk:#e7e1d7;
    --charcoal:#292524;
    --secondary:#57534e;
    --muted:#a8a29e;
    --green:#1E3F20;
    --sage:#6d8a63;
    --terra:#b5654a;
    --amber:#9a7530;
    --hair:#ece5da;
    --sage-tint:#f4f8f3;
    --sage-border:#cbdcc9;
    --terra-tint:#fbf3ee;
    --terra-border:#e2c0b3;
    --amber-tint:#fdf6ec;
    --amber-border:#eedec4;
    --serif:'Cormorant Garamond', Georgia, serif;
    --mono:'Space Grotesk', ui-monospace, monospace;
    --body:'Instrument Sans', system-ui, sans-serif;
    /* Font used for calendar day-numbers. Swap this one line to restyle every date. */
    --num:'Space Grotesk', ui-monospace, monospace;
  }
  .num{ font-family:var(--num); font-feature-settings:"tnum" 1, "lnum" 1; }
  .scroll-x{ scrollbar-width:none; -webkit-overflow-scrolling:touch; }
  *{ box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  html,body{ margin:0; padding:0; height:100%; }
  body{
    font-family:var(--body);
    background:var(--desk);
    color:var(--charcoal);
    -webkit-font-smoothing:antialiased;
    text-rendering:optimizeLegibility;
    overscroll-behavior:none;
  }
  /* hide scrollbars everywhere */
  ::-webkit-scrollbar{ width:0; height:0; display:none; }
  *{ scrollbar-width:none; -ms-overflow-style:none; }

  /* Splash */
  #splash{
    position:fixed; inset:0; z-index:9999;
    background:var(--alabaster);
    display:flex; align-items:center; justify-content:center;
    transition:opacity .45s ease;
  }
  #splash.hide{ opacity:0; pointer-events:none; }
  #splash span{
    font-family:var(--mono); font-weight:500;
    letter-spacing:.42em; font-size:22px; color:var(--green);
    padding-left:.42em;
  }

  /* Desktop device frame */
  #desk{
    min-height:100dvh; width:100%;
    display:flex; align-items:center; justify-content:center;
    background:var(--desk);
  }
  #phone{
    position:relative;
    width:392px; height:848px;
    background:var(--alabaster);
    border-radius:46px;
    overflow:hidden;
    box-shadow:0 40px 80px -20px rgba(41,37,36,.35), 0 0 0 1px rgba(41,37,36,.04);
    display:flex; flex-direction:column;
  }
  /* On mobile: full bleed */
  @media (max-width:640px){
    #desk{ background:var(--alabaster); align-items:stretch; }
    #phone{
      width:100%; height:100dvh; border-radius:0; box-shadow:none;
    }
  }

  .eyebrow{ font-family:var(--mono); font-weight:600; letter-spacing:.18em; text-transform:uppercase; font-size:11px; color:var(--secondary); }
  .mono{ font-family:var(--mono); }
  .serif{ font-family:var(--serif); }

  .scroll{ flex:1; min-height:0; overflow-y:auto; -webkit-overflow-scrolling:touch; overscroll-behavior:contain; }

  input[type=range]{ -webkit-appearance:none; appearance:none; height:3px; border-radius:3px; background:var(--sage-border); outline:none; }
  input[type=range]::-webkit-slider-thumb{ -webkit-appearance:none; appearance:none; width:22px; height:22px; border-radius:50%; background:var(--green); border:3px solid var(--alabaster); box-shadow:0 1px 4px rgba(41,37,36,.25); cursor:pointer; }
  input[type=range].terra{ background:var(--terra-border); }
  input[type=range].terra::-webkit-slider-thumb{ background:var(--terra); }

  input[type=number], input[type=date], input[type=time], select{
    font-family:var(--mono); font-size:14px; color:var(--charcoal);
    background:#fff; border:1px solid var(--hair); border-radius:12px;
    padding:11px 13px; outline:none; width:100%; min-width:0; max-width:100%; box-sizing:border-box;
  }
  input[type=text], input:not([type]){
    font-family:var(--body); font-size:15px; color:var(--charcoal);
    background:transparent; border:1px solid var(--hair); border-radius:12px;
    padding:11px 13px; outline:none; width:100%; min-width:0; max-width:100%; box-sizing:border-box;
  }
  input[type=date], input[type=time]{ -webkit-appearance:none; appearance:none; }
  input:focus, select:focus{ border-color:var(--sage); box-shadow:0 0 0 3px var(--sage-tint); }
  label.fld{ display:block; font-family:var(--mono); font-size:10.5px; letter-spacing:.14em; text-transform:uppercase; color:var(--secondary); margin:0 0 6px 2px; }

  .press{ transition:transform .08s ease, opacity .15s ease; }
  .press:active{ transform:scale(.97); }

  @media (prefers-reduced-motion: reduce){
    *{ transition:none !important; animation:none !important; }
  }
</style>
</head>
<body>
<div id="splash"><span>SOMA</span></div>
<div id="desk"><div id="phone"><div id="root"></div></div></div>
